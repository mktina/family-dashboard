<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 가족 기록장">
<title>우리 가족 기록장</title>
<style>
:root{
  --cream:#FFFDF2; --butter:#FFF7DC; --butter-soft:#FFFBEE; --butter-deep:#FFEFC6;
  --line:#F0E3C6; --line-soft:#F6EDD8;
  --ink:#5B4636; --ink-2:#7A6650; --ink-3:#A89780;
  --pink:#F09BB6; --pink-soft:#FDE9F0; --pink-deep:#E0708F;
  --mint:#E1F4E6; --mint-soft:#F1FAF3; --mint-deep:#7CBF92;
  --blue:#DEEBFA; --blue-soft:#F1F7FE; --blue-deep:#88AFD9;
  --yellow:#FFD766; --orange:#F5A55E;
  --green:#7CBF8C;
  --r-lg:26px; --r-md:20px; --r-sm:14px;
  --shadow:0 8px 22px rgba(196,163,96,.10);
  --shadow-soft:0 3px 10px rgba(196,163,96,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); min-height:100vh;
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;
  background-color:var(--cream);
  background-image:
    radial-gradient(90% 55% at 8% 0%, #FFF5D2 0%, rgba(255,245,210,0) 62%),
    radial-gradient(70% 45% at 96% 6%, #FDEBF1 0%, rgba(253,235,241,0) 58%),
    radial-gradient(80% 40% at 50% 100%, #FFF6DE 0%, rgba(255,246,222,0) 60%),
    linear-gradient(180deg,#FFF9E7 0%, #FFFDF2 34%, #FFFDF2 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;color:inherit;font-size:16px}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}

.app{max-width:480px;margin:0 auto;padding:0 16px 112px;position:relative}

/* ---------- header ---------- */
.app-head{padding:20px 0 4px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;display:block;filter:drop-shadow(0 2px 3px rgba(190,160,110,.18))}
svg{display:block}
.brand-mark svg{width:100%;height:100%}
.brand h1{
  font-size:23px;font-weight:900;letter-spacing:-.7px;line-height:1.15;white-space:nowrap;
  color:#E89FB8;
}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .brand h1{
    background:linear-gradient(95deg,#EFA0BC 0%,#E9A6A2 42%,#C6AE73 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;
  }
}
.icon-btn{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);
  border:1.5px solid var(--line);display:grid;place-items:center;font-size:16px;
  box-shadow:var(--shadow-soft);flex:none;
}
.icon-btn:active{transform:scale(.94)}
.head-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:8px}
.head-date{font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.2px}
.head-date b{font-weight:800;color:var(--ink)}
.head-sub{font-size:12px;color:var(--ink-3);font-weight:600;margin-top:2px}
.cheer{
  font-size:12px;font-weight:800;color:#A8823C;white-space:nowrap;
  background:linear-gradient(180deg,#FFFDF6,#FFF4D8);
  border:1.4px solid #F3E2B8;border-radius:999px;padding:7px 11px;
  box-shadow:var(--shadow-soft);
}

/* ---------- tabs ---------- */
.top-tabs{
  display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;padding:2px 0 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.top-tabs::-webkit-scrollbar{display:none}
.tab-chip{
  display:flex;align-items:center;gap:4px;flex:none;
  padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:-.4px;
  color:var(--ink-2);background:rgba(255,255,255,.7);border:1.4px solid var(--line);
  box-shadow:var(--shadow-soft);transition:transform .15s, background .2s;
}
.tab-chip span{font-size:13px;line-height:1}
.tab-chip.active{
  color:#7A5B22;border-color:#F3D999;
  background:linear-gradient(180deg,#FFF8E2,#FFEDC4);
  box-shadow:0 4px 12px rgba(226,186,96,.22);
}
.tab-chip:active{transform:scale(.96)}

/* ---------- generic ---------- */
.view{animation:viewIn .28s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.section{margin:16px 0 6px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:0 2px 9px}
.section-title{font-size:16.5px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.section-sub{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:3px;letter-spacing:-.2px}
.card{
  background:rgba(255,255,255,.78);border:1.5px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px;
}
.card.butter{background:linear-gradient(180deg,#FFFCF0,#FFF6DE);border-color:#F2E4C0}
.card.mint{background:linear-gradient(180deg,#F7FDF8,#EAF7EE);border-color:#D9EEDF}
.card.pink{background:linear-gradient(180deg,#FFF9FB,#FDEDF3);border-color:#F7DCE6}
.card.blue{background:linear-gradient(180deg,#FAFDFF,#EAF3FC);border-color:#DCEAF8}
.chip{
  display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  padding:5px 9px;border-radius:999px;background:#FFF9E8;border:1px solid #F1E2BE;color:#96773C;
}
.chip.pink{background:#FDEBF1;border-color:#F8D9E4;color:#C2698B}
.chip.mint{background:#EBF8EF;border-color:#D6EEDD;color:#57906B}
.chip.blue{background:#EEF5FD;border-color:#DCEAF8;color:#5C86B3}
.chip.gray{background:#F7F4EC;border-color:#EDE6D7;color:#8B7A65}
.bar{height:9px;border-radius:999px;background:#F3EBDA;overflow:hidden;box-shadow:inset 0 1px 2px rgba(170,145,100,.08)}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#A6DDB3,#69B981);transition:width .45s cubic-bezier(.3,1.2,.4,1)}
.bar.pinky>i{background:linear-gradient(90deg,#FBC0D3,#EE8CA9)}
.bar.bluey>i{background:linear-gradient(90deg,#B7D6F4,#7FAEDD)}
.bar.goldy>i{background:linear-gradient(90deg,#FFE29A,#F3B94E)}
.hint{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.5;letter-spacing:-.2px}
.empty{
  text-align:center;padding:14px 10px;border:1.6px dashed #E9DDBF;border-radius:18px;
  font-size:12.5px;font-weight:700;color:var(--ink-3);background:rgba(255,255,255,.5)
}

/* ---------- home summary ---------- */
.summary-card{position:relative;overflow:hidden;padding:18px 16px 15px}
.summary-card:after{
  content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#FFEDB8 0%,rgba(255,237,184,0) 70%);pointer-events:none;
}
.sum-eyebrow{font-size:11.5px;font-weight:800;color:#B08A44;letter-spacing:.2px}
.sum-title{font-size:19px;font-weight:900;letter-spacing:-.5px;margin-top:3px;display:flex;align-items:center;gap:6px}
.sum-line{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:5px}
.sum-bar-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.sum-bar-row .bar{flex:1}
.sum-count{font-size:12px;font-weight:900;color:#5D9A6E;white-space:nowrap}
.sum-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* ---------- family cards ---------- */
.fam-list{display:flex;flex-direction:column;gap:10px}
.fam-card{
  display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:22px;
  border:1.5px solid var(--line);background:rgba(255,255,255,.8);box-shadow:var(--shadow-soft);
  transition:transform .15s;
}
.fam-card:active{transform:scale(.99)}
.fam-card.mint{background:linear-gradient(100deg,#F6FCF8,#EAF7EE);border-color:#DAEEDF}
.fam-card.butter{background:linear-gradient(100deg,#FFFCF0,#FFF5D9);border-color:#F2E3BC}
.fam-card.pink{background:linear-gradient(100deg,#FFF9FB,#FDEBF2);border-color:#F7DAE5}
.fam-card.blue{background:linear-gradient(100deg,#FAFDFF,#E9F3FC);border-color:#DBE9F7}
.fam-avatar{
  width:58px;height:58px;flex:none;border-radius:19px;background:#fff;
  border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(180,150,100,.14);
  display:grid;place-items:center;overflow:hidden;
}
.fam-avatar svg{width:88%;height:88%}
.fam-main{flex:1;min-width:0}
.fam-name-row{display:flex;align-items:baseline;gap:6px;min-width:0}
.fam-name{font-size:16.5px;font-weight:900;letter-spacing:-.4px;white-space:nowrap;flex:none}
.fam-sub{font-size:10.5px;font-weight:700;color:var(--ink-3);line-height:1.25;min-width:0;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fam-progress{margin-top:7px;display:flex;align-items:center;gap:8px}
.fam-progress .bar{flex:1;height:7px}
.fam-progress-txt{font-size:11px;font-weight:800;color:var(--ink-2);white-space:nowrap}
.fam-right{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.fam-academy{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:-.2px;max-width:150px}
.dots{display:flex;gap:3px}
.dot{
  width:11px;height:11px;border-radius:50%;background:#F6EEDC;border:1.2px solid #EBDCBC;
}
.dot.on{background:linear-gradient(180deg,#FFE28F,#F6C24F);border-color:#EAB64B;box-shadow:0 1px 2px rgba(210,160,50,.3)}
.dot.on.pinky{background:linear-gradient(180deg,#FBC7D8,#F08FAC);border-color:#EE9CB3}
.sticker-mini{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#A8823C}

/* ---------- today / person cards ---------- */
.person-card{padding:14px 14px 10px;border-radius:var(--r-lg);border:1.5px solid var(--line);background:rgba(255,255,255,.82);box-shadow:var(--shadow);margin-bottom:12px}
.person-card.mint{background:linear-gradient(180deg,#FBFEFC,#F2FAF4);border-color:#D9EEDF}
.person-card.butter{background:linear-gradient(180deg,#FFFDF4,#FFF7E2);border-color:#F2E4C0}
.person-card.pink{background:linear-gradient(180deg,#FFFBFD,#FDF0F5);border-color:#F7DCE6}
.person-card.blue{background:linear-gradient(180deg,#FCFEFF,#EEF5FD);border-color:#DCEAF8}
.p-head{display:flex;align-items:center;gap:10px}
.p-avatar{width:44px;height:44px;flex:none;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 9px rgba(180,150,100,.14);border:1.2px solid #fff}
.p-avatar svg{width:90%;height:90%}
.p-main{flex:1;min-width:0}
.p-name{font-size:15.5px;font-weight:900;letter-spacing:-.3px}
.p-sub{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:2px}
.p-actions{display:flex;align-items:center;gap:6px;flex:none}
.small-btn{
  font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;
  background:#FFFDF6;border:1.3px solid #EFE1C0;color:#96773C;box-shadow:var(--shadow-soft);
}
.small-btn.mint{background:#EFFAF2;border-color:#D8EEDF;color:#4F8A63}
.small-btn:active{transform:scale(.95)}
.p-bar{margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.p-bar .bar{flex:1;height:7px}
.p-bar-count{font-size:11px;font-weight:900;color:var(--ink-2);white-space:nowrap}
.slot{margin-top:6px}
.slot-title{
  display:flex;align-items:center;gap:5px;margin:10px 2px 4px;
  font-size:12px;font-weight:900;color:#9A8459;letter-spacing:-.2px;
}
.slot-title .slot-emoji{font-size:13px}
.slot-title:after{content:"";flex:1; height:1px;background:linear-gradient(90deg,#F0E4C8,rgba(240,228,200,0))}
.task{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px dashed #F2E7CD}
.task:last-child{border-bottom:0}
.check{
  width:25px;height:25px;flex:none;border-radius:9px;border:2px solid #DFD0B1;background:#fff;
  display:grid;place-items:center;transition:all .18s;
}
.check svg{width:15px;height:15px;opacity:0;transform:scale(.5);transition:all .2s}
.task.done .check{background:linear-gradient(180deg,#93D3A2,#6FBC84);border-color:#6CB981}
.task.done .check svg{opacity:1;transform:none}
.task-text{flex:1;font-size:13.5px;font-weight:700;letter-spacing:-.25px;line-height:1.35;word-break:keep-all}
.task.done .task-text{color:#B6A992;text-decoration:line-through;text-decoration-color:#CFC1A6;text-decoration-thickness:1.5px}
.task-tools{display:flex;gap:4px;flex:none;opacity:.85}
.tool-btn{
  width:29px;height:29px;border-radius:10px;background:#FFFCF2;border:1.2px solid #F1E5CA;
  display:grid;place-items:center;font-size:12.5px;line-height:1;
}
.tool-btn:active{transform:scale(.92)}
.tool-btn.del{color:#C97C7C}
.add-btn{
  width:100%;margin:9px 0 4px;padding:10px;border-radius:14px;border:1.6px dashed #E4D5B2;
  background:rgba(255,253,246,.7);font-size:12.5px;font-weight:800;color:#A88C58;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.add-btn:active{transform:scale(.99)}
.academy-rest{
  display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:13px;
  background:#F4FAF5;border:1px dashed #D8EBDD;font-size:12px;font-weight:700;color:#6E9A7C;
}
.academy-rest.mint{background:#F1F9F3}

/* ---------- kid pages ---------- */
.kid-hero{position:relative;overflow:hidden;padding:16px;display:flex;gap:14px;align-items:center;border-radius:28px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.kid-hero.mint{background:linear-gradient(120deg,#F7FDF9 0%,#EAF7EE 60%,#FDFBF0 100%);border-color:#D8EEDF}
.kid-hero.butter{background:linear-gradient(120deg,#FFFCF0 0%,#FFF3CE 60%,#FFFBF0 100%);border-color:#F1E0B4}
.kid-hero-art{width:96px;height:96px;flex:none;display:grid;place-items:center;animation:floaty 4s ease-in-out infinite}
.kid-hero-art svg{width:100%;height:100%;filter:drop-shadow(0 5px 8px rgba(170,140,90,.16))}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.kid-hero-info{flex:1;min-width:0}
.kid-name{font-size:22px;font-weight:900;letter-spacing:-.6px;display:flex;align-items:center;gap:6px}
.kid-sub{font-size:11.5px;font-weight:700;color:var(--ink-2);margin-top:3px}
.kid-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.kid-hero-side{flex:none;align-self:flex-start}

.board-card{margin-top:12px;padding:15px 14px 14px}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.board-title{font-size:14.5px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:5px}
.board-summary{margin-top:10px;display:flex;align-items:center;gap:9px}
.board-summary .bar{flex:1}
.board-summary-txt{font-size:12px;font-weight:900;color:#96773C;white-space:nowrap}
.sticker-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.sticker-cell{
  position:relative;aspect-ratio:1/1.1;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;border:1.7px dashed #E8DBBB;
  background:rgba(255,253,246,.75);overflow:hidden;padding:5px 3px 4px;
}
.sticker-cell .cell-art{display:block;width:66%;height:auto;flex:none;padding-bottom:2px}
.sticker-cell .cell-art svg{width:100%;height:auto}
.sticker-cell .cell-label{line-height:1}
.sticker-cell.filled{
  border-style:solid;border-color:#F3DEA9;
  background:linear-gradient(180deg,#FFFDF4,#FFF2CC);
  box-shadow:0 4px 10px rgba(224,186,102,.18);
  animation:popIn .4s cubic-bezier(.2,1.4,.4,1) both;
}
.sticker-cell.filled.pinky{background:linear-gradient(180deg,#FFFBFD,#FDE7EF);border-color:#F6D2DF;box-shadow:0 4px 10px rgba(230,150,175,.16)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.cell-label{font-size:9px;font-weight:900;color:#B4965B;letter-spacing:-.2px;line-height:1.15;margin-top:1px}
.sticker-cell.filled .cell-label{color:#9B7A3B}
.sticker-cell.empty .cell-label{color:#C9BCA2}
.cell-plus{font-size:16px;color:#D8C9A8;font-weight:900;line-height:1.1;margin-top:10px}
.cell-name{font-size:8px;font-weight:800;color:#B09A70;letter-spacing:-.2px;line-height:1.15;max-width:96%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-evo{
  margin-top:12px;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:18px;
  background:linear-gradient(120deg,#FFF9E6,#FFFDF6);border:1.4px dashed #EBDCB8;
}
.next-evo-art{width:56px;height:56px;flex:none;display:grid;place-items:center;opacity:.92}
.next-evo-art svg{width:100%;height:100%}
.next-evo-txt{flex:1;min-width:0}
.next-evo-title{font-size:12.5px;font-weight:900;color:#9B7A3B;letter-spacing:-.2px}
.next-evo-name{font-size:11px;font-weight:700;color:var(--ink-3);margin-top:2px}
.evo-tag{font-size:9.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#FFF0C6;color:#A6812F;border:1px solid #F0DCA6;white-space:nowrap}

.routine-block{margin-top:12px;padding:14px}
.routine-title{font-size:13.5px;font-weight:900;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;margin-bottom:9px}
.routine-title .emo{font-size:15px}
.routine-list{display:flex;flex-direction:column;gap:6px}
.routine-item{
  display:flex;align-items:flex-start;gap:8px;font-size:12.5px;font-weight:700;color:#6E5C48;
  line-height:1.45;letter-spacing:-.2px;
}
.routine-item .bullet{width:6px;height:6px;border-radius:50%;background:#E7D6AE;margin-top:7px;flex:none}
.week-list{display:flex;flex-direction:column;gap:5px}
.wd-row{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:12px}
.wd-row.today{background:#FFF6DC;border:1.2px solid #F2E0B2}
.wd-row.rest{opacity:.72}
.wd{width:22px;flex:none;font-size:12px;font-weight:900;color:#A08347;text-align:center;padding-top:2px}
.wd-row.today .wd{color:#8C6A21}
.wd-row.sun .wd{color:#D18A9A}
.wd-chips{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.wd-chip{
  font-size:11.5px;font-weight:800;color:#7A6248;background:#fff;border:1px solid #EFE3C7;
  padding:4px 8px;border-radius:9px;letter-spacing:-.2px;
}
.wd-row.today .wd-chip{background:#FFFDF4;border-color:#EBD69C}
.wd-none{font-size:11.5px;font-weight:700;color:#B4A78F;padding-top:3px}
.board-foot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.reset-link{font-size:10.5px;font-weight:800;color:#B7A992;text-decoration:underline;text-underline-offset:2px;background:none;padding:4px}

/* ---------- 캐릭터 이미지 ---------- */
.fam-avatar img,.p-avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
img.av-hailey{background:radial-gradient(circle at 50% 38%,#FFFBEC 0%,#FFEED2 72%,#FDE6C4 100%)}
img.av-hayden{background:radial-gradient(circle at 50% 40%,#FFFDF2 0%,#FFF3D6 78%)}
.kid-hero-art img{background:none !important}
img.av-dad{object-position:50% 30%}
img.av-mom{object-position:50% 44%}
.kid-hero-art img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 6px 9px rgba(150,120,70,.14))}
.cell-art img{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 4px rgba(150,120,70,.16))}
.next-evo-art img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 6px rgba(150,120,70,.14))}
.modal-art img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 12px rgba(170,130,60,.2))}

/* ---------- 오늘 할 일 · 아이 선택 ---------- */
.kid-switch{
  display:flex;gap:6px;margin:0 0 12px;padding:5px;border-radius:20px;
  background:rgba(255,255,255,.72);border:1.4px solid var(--line);box-shadow:var(--shadow-soft);
}
.kid-switch button{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:15px;
  border:1.4px solid transparent;background:transparent;color:var(--ink-2);
  font-size:12px;font-weight:900;letter-spacing:-.3px;transition:transform .14s,background .2s;
}
.kid-switch button:active{transform:scale(.97)}
.kid-switch .ks-av{
  width:28px;height:28px;flex:none;border-radius:10px;overflow:hidden;background:#fff;
  box-shadow:0 2px 6px rgba(180,150,100,.18);display:grid;place-items:center;
}
.kid-switch .ks-av img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
.kid-switch .ks-av.two{
  display:grid;grid-template-columns:1fr 1fr;width:30px;height:28px;border-radius:10px;overflow:hidden;
  background:#fff;box-shadow:0 2px 6px rgba(180,150,100,.18);
}
.kid-switch .ks-av.two img{width:100%;height:100%;object-fit:cover;object-position:50% 26%;display:block}
.kid-switch .ks-av.two img + img{border-left:1px solid #fff}
.kid-switch .ks-txt{min-width:0;text-align:left;line-height:1.2}
.kid-switch .ks-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.kid-switch .ks-meta{display:block;font-size:9.5px;font-weight:800;color:#B7A992;margin-top:1px}
.kid-switch button.active{
  background:linear-gradient(180deg,#FFF9E6,#FFEEC8);border-color:#F3D999;color:#7A5B22;
  box-shadow:0 4px 12px rgba(226,186,96,.2);
}
.kid-switch button.active .ks-meta{color:#A8823C}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,253,244,.94);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1.5px solid var(--line);
  box-shadow:0 -6px 20px rgba(190,160,110,.08);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border-radius:16px;
  color:#A8977E;font-size:10.5px;font-weight:800;letter-spacing:-.25px;transition:all .18s;
}
.nav-item .nav-emoji{font-size:19px;line-height:1;filter:grayscale(.35);transition:all .18s}
.nav-item.active{color:#8A6A2A;background:linear-gradient(180deg,#FFF9E6,#FFEFC9);box-shadow:inset 0 0 0 1.2px #F2E0B0}
.nav-item.active .nav-emoji{filter:none;transform:translateY(-1px) scale(1.06)}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  padding:22px;background:rgba(88,68,42,.34);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  animation:fadeIn .2s ease both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{
  position:relative;width:100%;max-width:352px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#FFFDF6,#FFF8E4);
  border:2px solid #F8E6B4;border-radius:30px;padding:24px 20px 20px;text-align:center;
  box-shadow:0 22px 48px rgba(110,80,30,.28);
  animation:popCard .38s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes popCard{from{transform:scale(.86) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-art{width:132px;height:132px;margin:0 auto 6px;display:grid;place-items:center;animation:floaty 3.6s ease-in-out infinite}
.modal-art svg{width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(170,130,60,.18))}
.modal-eyebrow{font-size:11.5px;font-weight:900;color:#B08A44;letter-spacing:.6px}
.modal-title{font-size:25px;font-weight:900;letter-spacing:-.9px;margin-top:5px;line-height:1.25}
.modal-title em{font-style:normal;color:#E0829F}
.modal-msg{font-size:13px;font-weight:700;color:#7A6650;line-height:1.6;margin-top:9px;letter-spacing:-.2px;word-break:keep-all}
.modal-mini{display:flex;justify-content:center;gap:5px;margin:14px 0 4px}
.modal-mini .dot{width:14px;height:14px}
.modal-btn{
  width:100%;margin-top:16px;padding:14px;border-radius:18px;
  background:linear-gradient(180deg,#FFDF8C,#F7C451);color:#6B4E12;
  font-size:15px;font-weight:900;letter-spacing:-.3px;
  box-shadow:0 6px 0 #E7B23C,0 10px 20px rgba(220,170,60,.28);
  transition:transform .12s, box-shadow .12s;
}
.modal-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #E7B23C,0 6px 12px rgba(220,170,60,.24)}
.modal-btn.ghost{background:#FFFDF6;color:#8B7A65;box-shadow:inset 0 0 0 1.6px #EADFC6;margin-top:8px;padding:11px;font-size:13px}
.modal-btn.ghost:active{transform:scale(.98)}
.close-x{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.8);border:1px solid #EFE3C7;font-size:14px;color:#A8977E;display:grid;place-items:center}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:30px}
.confetti i{position:absolute;top:-10px;font-size:15px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(480px) rotate(300deg);opacity:0}}

/* form modal */
.form-card{text-align:left;padding:22px 18px 18px}
.form-title{font-size:17px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.form-label{font-size:11.5px;font-weight:900;color:#9A8459;margin:14px 0 6px;display:block}
.form-input,.form-select{
  width:100%;padding:12px 13px;border-radius:14px;border:1.5px solid #EADCB9;background:#fff;
  font-size:15px;font-weight:700;outline:none;color:var(--ink);
}
.form-input:focus,.form-select:focus{border-color:#E8C777;box-shadow:0 0 0 3px rgba(240,205,120,.22)}
.form-row{display:flex;gap:8px;margin-top:16px}
.form-row .modal-btn{margin:0;flex:1}
.form-row .ghost{flex:0 0 34%}
.form-error{font-size:11.5px;font-weight:800;color:#D07C7C;margin-top:7px;min-height:14px}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;
  background:rgba(90,70,40,.92);color:#FFF9E8;font-size:12.5px;font-weight:800;
  padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(90,70,40,.3);
  animation:toastIn .25s ease both;white-space:nowrap;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

.sparkle{position:absolute;font-size:12px;opacity:.8;animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.95;transform:scale(1.1)}}

@media (max-width:380px){
  .tab-chip{padding:7px 8px;font-size:11.5px;letter-spacing:-.5px}
  .brand h1{font-size:21px}
}
@media (min-width:520px){
  body{padding:0}
  .app{padding-bottom:120px}
  .bottom-nav{border-radius:22px 22px 0 0;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<body>

</div>

<script>
/* =========================================================
   우리 가족 기록장 — 인라인 SVG 일러스트
   ========================================================= */
var INK = '#5B4636';
var PAPER = '#FFFDF8';

function svgWrap(inner) {
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + inner + '</svg>';
}

function sparkle(x, y, s, color, opacity) {
  return '<path d="M' + x + ' ' + (y - s) + ' Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y +
    ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) + ' Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y +
    ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + ' Z" fill="' + (color || '#FFD766') +
    '" opacity="' + (opacity == null ? 1 : opacity) + '"/>';
}

function starPath(cx, cy, r, innerR) {
  var pts = [];
  for (var i = 0; i < 10; i++) {
    var rad = (i % 2 === 0) ? r : innerR;
    var a = -Math.PI / 2 + i * Math.PI / 5;
    pts.push((cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2));
  }
  return 'M' + pts.join(' L') + ' Z';
}

function heartPath(cx, cy, s) {
  return 'M' + cx + ' ' + (cy + s * 0.86) +
    ' C' + (cx - s * 1.05) + ' ' + (cy - s * 0.15) + ' ' + (cx - s * 0.6) + ' ' + (cy - s * 1.0) + ' ' + cx + ' ' + (cy - s * 0.33) +
    ' C' + (cx + s * 0.6) + ' ' + (cy - s * 1.0) + ' ' + (cx + s * 1.05) + ' ' + (cy - s * 0.15) + ' ' + cx + ' ' + (cy + s * 0.86) + ' Z';
}

/* ---------------- 치이카와풍 Hailey ---------------- */
function chikawa(o) {
  o = o || {};
  var eyes = o.eyes || 'dot';
  var mouth = o.mouth || 'w';
  var arms = o.arms || 'down';
  var prop = o.prop || '';
  var blush = (o.blush === undefined) ? 1 : o.blush;
  var g = '';

  g += '<ellipse cx="50" cy="97" rx="23" ry="3" fill="#E9DDC2" opacity=".65"/>';

  /* 귀 */
  g += '<circle cx="29" cy="31" r="9" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.8"/>';
  g += '<circle cx="71" cy="31" r="9" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.8"/>';

  /* 몸통 + 발 */
  g += '<ellipse cx="50" cy="84" rx="18" ry="12" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.8"/>';
  g += '<ellipse cx="40" cy="94" rx="7" ry="4.2" fill="#FFF3E4" stroke="' + INK + '" stroke-width="2.3"/>';
  g += '<ellipse cx="60" cy="94" rx="7" ry="4.2" fill="#FFF3E4" stroke="' + INK + '" stroke-width="2.3"/>';

  /* 팔 (뒤) */
  if (arms === 'up' || arms === 'wave') {
    g += '<g transform="rotate(-52 26 76)"><ellipse cx="26" cy="76" rx="4.8" ry="8" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.6"/></g>';
    if (arms === 'wave') {
      g += '<g transform="rotate(42 75 71)"><ellipse cx="75" cy="71" rx="4.8" ry="9.4" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.6"/></g>';
    } else {
      g += '<g transform="rotate(52 74 76)"><ellipse cx="74" cy="76" rx="4.8" ry="8" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.6"/></g>';
    }
  } else {
    g += '<ellipse cx="30" cy="85" rx="5" ry="7.2" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.6"/>';
    g += '<ellipse cx="70" cy="85" rx="5" ry="7.2" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.6"/>';
  }

  /* 머리 */
  g += '<circle cx="50" cy="52" r="25" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.8"/>';
  /* 정수리 하이라이트 */
  g += '<ellipse cx="40" cy="36" rx="7" ry="4" fill="#FFF9EC" opacity=".9" transform="rotate(-25 40 36)"/>';

  /* 볼 */
  if (blush > 0) {
    g += '<ellipse cx="33" cy="60" rx="5.6" ry="3.5" fill="#FFB6CB" opacity="' + (0.55 + 0.35 * blush) + '"/>';
    g += '<ellipse cx="67" cy="60" rx="5.6" ry="3.5" fill="#FFB6CB" opacity="' + (0.55 + 0.35 * blush) + '"/>';
  }

  /* 눈 */
  if (eyes === 'dot') {
    g += '<circle cx="41" cy="52" r="3.4" fill="#453529"/><circle cx="42" cy="50.9" r="1.1" fill="#fff"/>';
    g += '<circle cx="59" cy="52" r="3.4" fill="#453529"/><circle cx="60" cy="50.9" r="1.1" fill="#fff"/>';
  } else if (eyes === 'happy') {
    g += '<path d="M36.5 53.5 Q41 47.5 45.5 53.5" fill="none" stroke="#453529" stroke-width="2.7" stroke-linecap="round"/>';
    g += '<path d="M54.5 53.5 Q59 47.5 63.5 53.5" fill="none" stroke="#453529" stroke-width="2.7" stroke-linecap="round"/>';
  } else if (eyes === 'sleepy') {
    g += '<path d="M36.5 51.5 Q41 55.8 45.5 51.5" fill="none" stroke="#453529" stroke-width="2.6" stroke-linecap="round"/>';
    g += '<path d="M54.5 51.5 Q59 55.8 63.5 51.5" fill="none" stroke="#453529" stroke-width="2.6" stroke-linecap="round"/>';
  } else if (eyes === 'wink') {
    g += '<circle cx="41" cy="52" r="3.3" fill="#453529"/><circle cx="42" cy="50.9" r="1.1" fill="#fff"/>';
    g += '<path d="M54.5 53.5 Q59 47.5 63.5 53.5" fill="none" stroke="#453529" stroke-width="2.7" stroke-linecap="round"/>';
  } else if (eyes === 'gentle') {
    g += '<circle cx="41" cy="52" r="2.7" fill="#453529"/><circle cx="59" cy="52" r="2.7" fill="#453529"/>';
  }

  /* 입 */
  if (mouth === 'w') {
    g += '<path d="M46.3 59.6 q1.85 2.5 3.7 0 q1.85 2.5 3.7 0" fill="none" stroke="#453529" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>';
  } else if (mouth === 'o') {
    g += '<ellipse cx="50" cy="61" rx="2.9" ry="3.4" fill="#E9909B" stroke="#453529" stroke-width="1.5"/>';
  } else if (mouth === 'smile') {
    g += '<path d="M45.6 59 q4.4 4.6 8.8 0" fill="none" stroke="#453529" stroke-width="2.2" stroke-linecap="round"/>';
  } else {
    g += '<path d="M48.4 60.4 q1.6 1.5 3.2 0" fill="none" stroke="#453529" stroke-width="2" stroke-linecap="round"/>';
  }

  /* 소품 */
  if (prop === 'heart') {
    g += '<path d="' + heartPath(50, 86, 8.4) + '" fill="#F59AB6" stroke="' + INK + '" stroke-width="2.3"/>';
    g += '<ellipse cx="46.5" cy="82.5" rx="2.2" ry="1.4" fill="#FFD3E0" opacity=".9" transform="rotate(-30 46.5 82.5)"/>';
    g += '<ellipse cx="38" cy="87" rx="3.6" ry="5.4" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.3" transform="rotate(-24 38 87)"/>';
    g += '<ellipse cx="62" cy="87" rx="3.6" ry="5.4" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.3" transform="rotate(24 62 87)"/>';
  } else if (prop === 'cookie') {
    g += '<circle cx="50" cy="86" r="8.6" fill="#F3C88B" stroke="' + INK + '" stroke-width="2.3"/>';
    g += '<circle cx="47" cy="83.5" r="1.3" fill="#8B5E3C"/><circle cx="53" cy="87" r="1.4" fill="#8B5E3C"/><circle cx="50.5" cy="82" r="1" fill="#8B5E3C"/>';
    g += '<path d="M52 89 q1.4 1.3 2.8 0" fill="none" stroke="#E9B978" stroke-width="1.3" stroke-linecap="round"/>';
    g += '<ellipse cx="43" cy="84" rx="3.2" ry="4.6" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.1" transform="rotate(-34 43 84)"/>';
    g += '<ellipse cx="57" cy="84" rx="3.2" ry="4.6" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.1" transform="rotate(34 57 84)"/>';
  } else if (prop === 'book') {
    g += '<path d="M34 83 q8 -4 16 0 q8 -4 16 0 l0 10 q-8 -4 -16 0 q-8 -4 -16 0 Z" fill="#FFF6DF" stroke="' + INK + '" stroke-width="2.3" stroke-linejoin="round"/>';
    g += '<path d="M50 83 l0 10" stroke="' + INK + '" stroke-width="1.7"/>';
    g += '<path d="M38 86 h7 M55 86 h7 M38 89 h6 M56 89 h6" stroke="#DCC9A4" stroke-width="1.3" stroke-linecap="round"/>';
    g += '<ellipse cx="32" cy="83" rx="3.4" ry="5" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.2" transform="rotate(-28 32 83)"/>';
    g += '<ellipse cx="68" cy="83" rx="3.4" ry="5" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.2" transform="rotate(28 68 83)"/>';
  } else if (prop === 'starwand') {
    g += '<line x1="63" y1="89" x2="78" y2="60" stroke="' + INK + '" stroke-width="3" stroke-linecap="round"/>';
    g += '<path d="' + starPath(81, 53, 9.5, 4.2) + '" fill="#FFD766" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"/>';
    g += '<ellipse cx="59" cy="88" rx="3.8" ry="5.4" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="2.3" transform="rotate(28 59 88)"/>';
  }

  /* 왕관 */
  if (prop === 'crown' || o.crown) {
    g += '<path d="M37 30 L39.5 18 L45 23.5 L50 14 L55 23.5 L60.5 18 L63 30 Z" fill="#FFD766" stroke="' + INK + '" stroke-width="2.3" stroke-linejoin="round"/>';
    g += '<circle cx="50" cy="24" r="1.8" fill="#F07C9A"/><circle cx="42.5" cy="26" r="1.4" fill="#8FBFE8"/><circle cx="57.5" cy="26" r="1.4" fill="#8FBFE8"/>';
  }

  /* Zzz */
  if (o.zzz) {
    g += '<text x="74" y="26" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#9A8459">z</text>';
    g += '<text x="80" y="17" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#B4A183">z</text>';
  }

  if (o.sparkles) {
    var n = o.sparkles;
    if (n > 0) g += sparkle(76, 34, 5, '#FFD766', .95);
    if (n > 1) g += sparkle(20, 44, 3.6, '#F7B7C8', .9);
    if (n > 2) g += sparkle(82, 70, 3.2, '#A9D8B6', .9);
    if (n > 3) g += sparkle(16, 22, 3, '#FFE9A8', .9);
  }
  return svgWrap(g);
}

/* ---------------- 피카츄 계열 ---------------- */
function pikachuBody(o) {
  o = o || {};
  var fur = o.fur || '#FFD64E';
  var cheek = o.cheek || '#F4787A';
  var eyeColor = o.eye || '#3A2E27';
  var tip = o.tip || '#3A2E27';
  var g = '';

  /* 꼬리 */
  if (o.tail === 'bolt') {
    g += '<path d="M64 82 L77 76 L72 71 L86 63 L81 58 L92 52 L85 72 L91 76 L68 90 Z" fill="' + fur + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>';
    g += '<path d="M64 82 L70 79 L72 84 Z" fill="#B5824A" stroke="none"/>';
  } else if (o.tail === 'thin') {
    g += '<path d="M66 84 C 78 84 80 70 88 68" fill="none" stroke="' + INK + '" stroke-width="6" stroke-linecap="round"/>';
    g += '<path d="M66 84 C 78 84 80 70 88 68" fill="none" stroke="' + fur + '" stroke-width="3.4" stroke-linecap="round"/>';
    g += '<path d="M84 62 L94 52 L92 64 L98 68 L88 74 Z" fill="#FFD64E" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"/>';
  } else if (o.tail === 'surf') {
    g += '<path d="M30 84 C 24 92 34 98 50 98 C 66 98 78 94 82 86 C 86 78 74 76 66 80 C 58 84 40 76 30 84 Z" fill="' + fur + '" stroke="' + INK + '" stroke-width="2.4"/>';
    g += '<path d="M40 88 C 48 92 60 92 70 86" fill="none" stroke="#D98B4F" stroke-width="2" stroke-linecap="round" opacity=".7"/>';
  }

  /* 몸통 + 팔 + 발 */

        var list = ROUTINE[pid].academy[weekday()] || [];

        html += '<div class="p-avatar" style="width:36px;height:36px;border-radius:12px">' + avatarArt(pid) + '</div>';
        html += '<div style="flex:1"><div style="font-size:13px;font-weight:900">' + p.name + '</div><div style="font-size:10.5px;font-weight:700;color:#A89780">' + DAY_NAMES[weekday()] + '요일</div></div>';
        html += '<div class="wd-chips" style="justify-content:flex-end">';
        list.forEach(function (t) { html += '<span class="wd-chip">' + t + '</span>'; });
        html += '</div></div>';
      });
    }
    html += '</div></section>';
    return html;
  }

  function famCard(p) {
    var s = stats(p.id);
    var st = S.stickers[p.id];
    var html = '';
    var target = p.kind === 'child' ? p.id : 'today';
    html += '<button class="fam-card ' + p.tint + '" data-act="go" data-view="' + target + '" data-focus="' + (p.kind === 'child' ? '' : p.id) + '" style="text-align:left;width:100%">';
    html += '<span class="fam-avatar">' + avatarArt(p.id) + '</span>';
    html += '<span class="fam-main">';
    html += '<span class="fam-name-row"><span class="fam-name">' + p.name + '</span><span class="fam-sub">' + p.sub + '</span></span>';
    html += '<span class="fam-progress"><span class="bar"><i style="width:' + s.pct + '%"></i></span><span class="fam-progress-txt">' + s.done + '/' + s.total + ' 완료</span></span>';
    if (p.kind === 'child' && weekday() !== 0) {
      var list = ROUTINE[p.id].academy[weekday()] || [];
      html += '<span class="fam-academy">오늘 학원 · ' + (list.length ? list.join(' · ') : '없음') + '</span>';
    } else if (p.kind === 'child') {
      html += '<span class="fam-academy">오늘은 학원 쉬는 날 🌿</span>';
    } else {
      html += '<span class="fam-academy">' + (s.total ? '할 일 ' + s.total + '개 · 체크해서 응원해요' : '할 일을 추가해 보세요') + '</span>';
    }
    html += '</span>';
    html += '<span class="fam-right">';
    if (p.kind === 'child') {
      var dots = '';
      for (var i = 0; i < 7; i++) dots += '<span class="dot' + (i < st.count ? ' on' + (p.id === 'hailey' ? ' pinky' : '') : '') + '"></span>';
      html += '<span class="dots">' + dots + '</span>';
      html += '<span class="sticker-mini">' + (st.count >= 7 ? '7장 완성 🎁' : '7장까지 ' + (7 - st.count) + '장 남음') + '</span>';
    } else {
      html += '<span class="chip ' + (p.tint === 'pink' ? 'pink' : 'blue') + '">' + (s.total ? s.done + '/' + s.total : '할 일 0') + '</span>';
    }
    html += '</span>';
    html += '</button>';
    return html;
  }

  /* ---------- 오늘 할 일 ---------- */
  function kidSwitch() {
    var html = '<div class="kid-switch" role="tablist" aria-label="아이 선택">';
    ['hailey', 'hayden'].forEach(function (pid) {
      var p = person(pid);
      var s = stats(pid);
      var st = S.stickers[pid];
      html += '<button role="tab" aria-selected="' + (todayKid === pid ? 'true' : 'false') + '" class="' + (todayKid === pid ? 'active' : '') + '" data-act="kidTab" data-kid="' + pid + '">';
      html += '<span class="ks-av">' + avatarArt(pid) + '</span>';
      html += '<span class="ks-txt"><span class="ks-name">' + p.name + '</span>';
      html += '<span class="ks-meta">' + s.done + '/' + s.total + ' · 스티커 ' + st.count + '/7</span></span>';
      html += '</button>';
    });
    var d = stats('dad'), m = stats('mom');
    html += '<button role="tab" aria-selected="' + (todayKid === 'parents' ? 'true' : 'false') + '" class="' + (todayKid === 'parents' ? 'active' : '') + '" data-act="kidTab" data-kid="parents">';
    html += '<span class="ks-av two">' + avatarArt('dad') + avatarArt('mom') + '</span>';
    html += '<span class="ks-txt"><span class="ks-name">아빠·엄마</span>';
    html += '<span class="ks-meta">' + (d.done + m.done) + '/' + (d.total + m.total) + ' · 오늘</span></span>';
    html += '</button>';
    html += '</div>';
    return html;
  }

  function viewToday() {
    var html = '';
    html += '<section class="section">';
    html += '<div class="section-head" style="align-items:center"><div class="section-title">✅ 오늘 할 일</div>';
    html += '<button class="small-btn" data-act="add" data-person="' + (todayKid === 'parents' ? 'dad' : todayKid) + '">+ 할 일 추가</button></div>';
    html += '<div class="section-sub" style="margin:-2px 2px 10px">' + fmtDate(todayDate) + ' · 요일별 학원 일정이 자동으로 들어와요</div>';
    html += kidSwitch();
    if (todayKid === 'parents') {
      FAMILY.forEach(function (p) { if (p.kind === 'parent') html += personCard(p); });
    } else {
      html += personCard(person(todayKid));
    }
    html += '</section>';
    return html;
  }

  function personCard(p) {
    var s = stats(p.id);
    var t = tasks(p.id);
    var st = S.stickers[p.id];
    var html = '';
    html += '<div class="person-card ' + p.tint + '" id="person-' + p.id + '">';
    html += '<div class="p-head">';
    html += '<div class="p-avatar">' + avatarArt(p.id) + '</div>';
    html += '<div class="p-main"><div class="p-name">' + p.name + '</div><div class="p-sub">' + s.done + '/' + s.total + '개 완료' +
      (p.kind === 'child' ? ' · ' + (st.count >= 7 ? '스티커판 가득 🎁' : '7장까지 ' + (7 - st.count) + '장') : '') + '</div></div>';
    if (t.length) {
      html += '<div class="p-actions"><button class="small-btn ' + (p.tint === 'mint' ? 'mint' : '') + '" data-act="checkall" data-person="' + p.id + '">전체 완료</button></div>';
    }
    html += '</div>';
    html += '<div class="p-bar"><div class="bar"><i style="width:' + s.pct + '%"></i></div><span class="p-bar-count">' + s.pct + '%</span></div>';

    var slots = slotsFor(p);
    slots.forEach(function (slot) {
      if (p.kind === 'parent' && slot.key !== 'morning' && slot.key !== 'evening') return;
      var list = t.filter(function (x) { return x.slot === slot.key; });
      if (slot.key === 'academy' && weekday() === 0) {
        html += '<div class="slot"><div class="slot-title"><span class="slot-emoji">' + slot.emoji + '</span>' + slot.label + '</div>';
        html += '<div class="academy-rest">🌿 일요일은 학원 쉬는 날이에요</div></div>';
        return;
      }
      if (!list.length && slot.key !== 'academy') return;
      if (!list.length && slot.key === 'academy' && weekday() !== 0) {
        html += '<div class="slot"><div class="slot-title"><span class="slot-emoji">' + slot.emoji + '</span>' + slot.label + '</div>';
        html += '<div class="academy-rest">오늘은 학원 일정이 없어요 · 여유롭게!</div></div>';
        return;
      }
      html += '<div class="slot"><div class="slot-title"><span class="slot-emoji">' + slot.emoji + '</span>' + slot.label + '</div>';
      list.forEach(function (task) {
        html += taskRow(p, task);
      });
      html += '</div>';
    });

    if (!t.length) {
      html += '<div class="empty">' + p.name + '의 할 일을 추가해 보세요 🌱</div>';
    }
    html += '<button class="add-btn" data-act="add" data-person="' + p.id + '">+ ' + p.name + ' 할 일 추가</button>';
    html += '</div>';
    return html;
  }

  function taskRow(p, task) {
    var html = '';
    html += '<div class="task' + (task.done ? ' done' : '') + '">';
    html += '<button class="check" data-act="toggle" data-person="' + p.id + '" data-id="' + task.id + '" aria-label="완료 체크">' +
      '<svg viewBox="0 0 20 20" fill="none"><path d="M4 10.5 L8 14.5 L16 5.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
    html += '<div class="task-text">' + esc(task.text) + '</div>';
    html += '<div class="task-tools">';
    html += '<button class="tool-btn" data-act="edit" data-person="' + p.id + '" data-id="' + task.id + '" aria-label="수정">✏️</button>';
    html += '<button class="tool-btn del" data-act="del" data-person="' + p.id + '" data-id="' + task.id + '" aria-label="삭제">✕</button>';
    html += '</div></div>';
    return html;
  }

  /* ---------- 아이 전체 화면 ---------- */
  function viewKid(pid) {
    var p = person(pid);
    var st = S.stickers[pid];
    var s = stats(pid);
    var isHayden = pid === 'hayden';
    var left = 7 - st.count;
    var html = '';

    html += '<div class="kid-hero ' + p.tint + '">';
    html += '<div class="kid-hero-art">' + avatarArt(pid) + '</div>';
    html += '<div class="kid-hero-info">';
    html += '<div class="kid-name">' + p.name + ' <span class="chip ' + (isHayden ? '' : 'mint') + '">' + (isHayden ? '7세' : '11세') + '</span></div>';
    html += '<div class="kid-sub">' + (isHayden ? '피카츄와 함께 진화 중 ⚡' : '치이카와와 함께 🐹') + ' · 오늘 ' + s.done + '/' + s.total + ' 완료</div>';
    html += '<div class="kid-badges">';
    html += '<span class="chip">' + (isHayden ? '⚡ 진화하는 피카츄 7단계' : '🐹 치이카와 스티커 7종') + '</span>';
    html += '<span class="chip ' + (isHayden ? 'blue' : 'pink') + '">' + (left > 0 ? left + '장 남음' : '7장 완성 🎁') + '</span>';
    html += '</div></div></div>';

    /* 스티커판 */
    html += '<div class="card board-card">';
    html += '<div class="board-head"><div class="board-title">' + (isHayden ? '⚡' : '🐹') + ' ' + p.name + ' 스티커판</div><span class="chip">' + st.count + '/7</span></div>';
    html += '<div class="board-summary"><div class="bar ' + (isHayden ? 'goldy' : 'pinky') + '"><i style="width:' + Math.round(st.count / 7 * 100) + '%"></i></div><div class="board-summary-txt">' + leftText(pid) + '</div></div>';
    html += '<div class="sticker-board">';
    for (var i = 0; i < 7; i++) {
      var filled = i < st.count;
      var isNext = i === st.count && st.count < 7;
      html += '<div class="sticker-cell ' + (filled ? 'filled' + (pid === 'hailey' ? ' pinky' : '') : (isNext ? 'empty next' : 'empty')) + '">';
      if (filled) {
        html += '<span class="cell-art">' + stickerArt(pid, i) + '</span>';
        html += '<span class="cell-label">' + (i + 1) + '일차</span>';
        html += '<span class="cell-name">' + stickerName(pid, i) + '</span>';
      } else {
        html += '<span class="cell-plus">' + (isNext ? '＋' : '') + '</span>';
        html += '<span class="cell-label">' + (i + 1) + '일차</span>';
        html += '<span class="cell-name">' + (isHayden ? HAYDEN_STAGES[i].tag : '도전!') + '</span>';
      }
      html += '</div>';
    }
    html += '</div>';

    if (isHayden) {
      var nextIdx = Math.min(st.count, 6);
      html += '<div class="next-evo">';
      html += '<div class="next-evo-art">' + HAYDEN_STAGES[nextIdx].art() + '</div>';
      html += '<div class="next-evo-txt"><div class="next-evo-title">다음 진화 미리보기 · ' + HAYDEN_STAGES[nextIdx].tag + '</div><div class="next-evo-name">' + (st.count >= 7 ? '이미 최강! 새 스티커판에서 다시 만나요' : '“' + HAYDEN_STAGES[nextIdx].name + '” — ' + (nextIdx - st.count + 1) + '장 더 모으면 만나요!') + '</div></div>';
      html += '<span class="evo-tag">' + (st.count >= 7 ? 'MAX' : 'NEXT') + '</span>';
      html += '</div>';
    } else {
      var nextH = Math.min(st.count, 6);
      html += '<div class="next-evo">';
      html += '<div class="next-evo-art">' + HAILEY_STICKERS[nextH].art() + '</div>';
      html += '<div class="next-evo-txt"><div class="next-evo-title">다음 스티커 미리보기</div><div class="next-evo-name">' + (st.count >= 7 ? '스티커판을 모두 채웠어요! 새 판에서 다시 만나요' : '“' + HAILEY_STICKERS[nextH].name + '” — 오늘 할 일을 모두 체크하면 받아요!') + '</div></div>';
      html += '<span class="evo-tag">' + (st.count >= 7 ? 'MAX' : 'NEXT') + '</span>';
      html += '</div>';
    }

    html += '<div class="board-foot"><span class="hint">완성한 스티커판 <b>' + st.boardsDone + '판</b> · 총 스티커 ' + (st.boardsDone * 7 + st.count) + '장</span>';
    html += '<button class="reset-link" data-act="resetBoard" data-person="' + pid + '">초기화</button></div>';
    html += '</div>';

    /* 전체 루틴 */
    html += routineBlocks(pid);
    return html;
  }

  function routineBlocks(pid) {
    var r = ROUTINE[pid];
    var p = person(pid);
    var html = '';
    html += '<div class="card routine-block"><div class="routine-title"><span class="emo">🌤</span>아침 루틴</div><div class="routine-list">';
    r.morning.forEach(function (t) { html += '<div class="routine-item"><span class="bullet"></span><span>' + esc(t) + '</span></div>'; });
    html += '</div></div>';

    html += '<div class="card routine-block"><div class="routine-title"><span class="emo">' + p.afterEmoji + '</span>' + p.afterLabel + '</div><div class="routine-list">';
    r.after.forEach(function (t) { html += '<div class="routine-item"><span class="bullet"></span><span>' + esc(t) + '</span></div>'; });
    html += '</div></div>';

    html += '<div class="card routine-block"><div class="routine-title"><span class="emo">📚</span>' + DAY_NAMES[weekday()] + '요일 학원 · 한 주 전체 시간표</div><div class="week-list">';
    [1, 2, 3, 4, 5, 6].forEach(function (wd) {
      var list = r.academy[wd] || [];
      var isToday = wd === weekday();
      html += '<div class="wd-row' + (isToday ? ' today' : '') + '"><span class="wd">' + DAY_NAMES[wd] + '</span>';
      html += '<span class="wd-chips">';
      if (list.length) {
        list.forEach(function (t) { html += '<span class="wd-chip">' + esc(t) + '</span>'; });
      } else {
        html += '<span class="wd-none">학원 없음</span>';
      }
      html += '</span></div>';
    });
    html += '<div class="wd-row rest sun"><span class="wd">일</span><span class="wd-chips"><span class="wd-none">학원 쉬는 날 🌿</span></span></div>';
    html += '</div></div>';

    html += '<div class="card routine-block"><div class="routine-title"><span class="emo">🌙</span>저녁 루틴</div><div class="routine-list">';
    r.evening.forEach(function (t) { html += '<div class="routine-item"><span class="bullet"></span><span>' + esc(t) + '</span></div>'; });
    html += '</div></div>';
    return html;
  }

  /* ---------- 모달 ---------- */
  function openModal(inner) {
    document.getElementById('modalRoot').innerHTML = '<div class="modal">' + inner + '</div>';
  }
  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
  }

  function openTaskForm(pid, taskId) {
    var p = pid ? person(pid) : null;
    var editing = false;
    var task = null;
    if (p && taskId) {
      var list = tasks(pid);
      for (var i = 0; i < list.length; i++) if (list[i].id === taskId) task = list[i];
      editing = !!task;
    }
    var options = '';
    FAMILY.forEach(function (f) {
      options += '<option value="' + f.id + '"' + (p && p.id === f.id ? ' selected' : '') + '>' + f.name + '</option>';
    });
    var slotOptions = '';
    var slotPerson = p || FAMILY[0];
    slotsFor(slotPerson).forEach(function (s) {
      slotOptions += '<option value="' + s.key + '"' + (task && task.slot === s.key ? ' selected' : '') + '>' + s.label + '</option>';
    });

    var html = '<div class="modal-card form-card">';
    html += '<div class="form-title">' + (editing ? '✏️ 할 일 수정' : '➕ 할 일 추가') + '</div>';
    if (!p) {
      html += '<label class="form-label">누구의 할 일인가요?</label>';
      html += '<select class="form-select" id="fPerson">' + options + '</select>';
    } else {
      html += '<input type="hidden" id="fPerson" value="' + p.id + '">';
      html += '<div class="hint" style="margin-top:6px">' + p.name + '의 오늘 할 일에 추가돼요</div>';
    }
    html += '<label class="form-label">할 일 내용</label>';
    html += '<input class="form-input" id="fText" type="text" maxlength="60" placeholder="예) 책 30분 읽기" value="' + (task ? esc(task.text) : '') + '">';
    html += '<label class="form-label">시간대</label>';
    html += '<select class="form-select" id="fSlot">' + slotOptions + '</select>';
    html += '<div class="form-error" id="fError"></div>';
    html += '<div class="form-row"><button class="modal-btn" data-act="saveTask" data-id="' + (task ? task.id : '') + '">' + (editing ? '저장' : '추가하기') + '</button>';
    html += '<button class="modal-btn ghost" data-act="closeModal">취소</button></div>';
    html += '</div>';
    openModal(html);
    setTimeout(function () {
      var el = document.getElementById('fText');
      if (el) el.focus();
    }, 60);
    var sel = document.getElementById('fPerson');
    if (sel && sel.tagName === 'SELECT') {
      sel.addEventListener('change', function () {
        var slotEl = document.getElementById('fSlot');
        var so = '';
        slotsFor(person(sel.value)).forEach(function (s) {
          so += '<option value="' + s.key + '">' + s.label + '</option>';
        });
        slotEl.innerHTML = so;
      });
    }
  }

  function saveTaskForm(taskId) {
    var pid = document.getElementById('fPerson').value;
    var text = (document.getElementById('fText').value || '').trim();
    var slot = document.getElementById('fSlot').value;
    var err = document.getElementById('fError');
    if (!text) {
      err.textContent = '할 일 내용을 적어 주세요!';
      return;
    }
    var list = tasks(pid);
    if (taskId) {
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === taskId) { list[i].text = text; list[i].slot = slot; }
      }
      toast('할 일을 수정했어요 ✏️');
    } else {
      list.push({ id: uid(), text: text, slot: slot, done: false, base: null });
      toast(person(pid).name + '의 할 일을 추가했어요 🌱');
    }
    save();
    closeModal();
    render();
  }

  function openConfirm(text, okLabel, act, data) {
    var html = '<div class="modal-card form-card" style="text-align:center">';
    html += '<div class="form-title" style="justify-content:center">' + text + '</div>';
    html += '<div class="form-row"><button class="modal-btn" ' +
      Object.keys(data || {}).map(function (k) { return 'data-' + k + '="' + data[k] + '"'; }).join(' ') +
      ' data-act="' + act + '">' + okLabel + '</button>';
    html += '<button class="modal-btn ghost" data-act="closeModal">취소</button></div>';
    html += '</div>';
    openModal(html);
  }

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 1800);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var overlay = e.target.closest ? e.target.closest('.modal') : null;
    var el = e.target.closest('[data-act]');
    if (!el) {
      if (overlay && e.target === overlay) closeModal();
      return;
    }
    var act = el.getAttribute('data-act');
    var pid = el.getAttribute('data-person');
    var id = el.getAttribute('data-id');

    if (act === 'kidTab') {
      var kid = el.getAttribute('data-kid');
      if (kid === 'hailey' || kid === 'hayden' || kid === 'parents') {
        todayKid = kid;
        try { localStorage.setItem(STORE_KEY + '.todayKid', kid); } catch (e) {}
        render();
      }
      return;
    }
    if (act === 'go') {
      var focus = el.getAttribute('data-focus');
      view = el.getAttribute('data-view');
      if (view === 'today' && (focus === 'dad' || focus === 'mom')) {
        todayKid = 'parents';
        try { localStorage.setItem(STORE_KEY + '.todayKid', 'parents'); } catch (e) {}
      }
      render();
      if (focus) {
        var target = document.getElementById('person-' + focus);
        if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      return;
    }
    if (act === 'toggle') {
      var list = tasks(pid);
      for (var i = 0; i < list.length; i++) {
        if (list[i].id === id) list[i].done = !list[i].done;
      }
      save();
      render();
      maybeAward(pid);
      return;
    }
    if (act === 'checkall') {
      var l2 = tasks(pid);
      var allDone = l2.every(function (x) { return x.done; });
      l2.forEach(function (x) { x.done = !allDone; });
      save();
      render();
      if (!allDone) maybeAward(pid);
      return;
    }
    if (act === 'add') {
      openTaskForm(pid || null, null);
      return;
    }
    if (act === 'edit') {
      openTaskForm(pid, id);
      return;
    }
    if (act === 'del') {
      var t = null, l3 = tasks(pid);
      for (var j = 0; j < l3.length; j++) if (l3[j].id === id) t = l3[j];
      if (!t) return;
      openConfirm('이 할 일을 지울까요?', '지우기', 'delConfirm', { person: pid, id: id });
      return;
    }
    if (act === 'delConfirm') {
      var l4 = tasks(pid);
      for (var k = 0; k < l4.length; k++) {
        if (l4[k].id === id) { l4.splice(k, 1); break; }
      }
      save();
      closeModal();
      render();
      toast('할 일을 지웠어요');
      return;
    }
    if (act === 'saveTask') {
      saveTaskForm(id || '');
      return;
    }
    if (act === 'closeModal') {
      closeModal();
      return;
    }
    if (act === 'startNew') {
      startNewBoard(pid);
      return;
    }
    if (act === 'resetBoard') {
      openConfirm('스티커판을 처음부터 다시 시작할까요?<br><span class="hint">테스트할 때만 사용해 주세요</span>', '초기화', 'resetConfirm', { person: pid });
      return;
    }
    if (act === 'resetConfirm') {
      var st = S.stickers[pid];
      st.count = 0;
      st.pending = false;
      st.awarded = {};
      st.log = [];
      save();
      closeModal();
      render();
      toast('스티커판을 초기화했어요');
      return;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    var now = new Date();
    var k = keyOf(now);
    if (k !== TODAY) {
      todayDate = now;
      TODAY = k;
      render();
    }
  });

  document.getElementById('btnCalendar').addEventListener('click', function () {
    view = 'today';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  render();
})();

</script>
</body>
</html>
